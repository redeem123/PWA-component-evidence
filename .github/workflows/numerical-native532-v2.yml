name: Single-use author-admitted numerical v2 measurement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install the prescribed Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10.19'
      - name: Install prescribed CPU wheels
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pwa-measurement-setup"
          python -m venv "$RUNNER_TEMP/pwa-measurement-env"
          "$RUNNER_TEMP/pwa-measurement-env/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --no-deps 'https://files.pythonhosted.org/packages/f3/6e/1736e5b4ae2b778ef2f81c47d797de9f891d4d8acb047a24ca37a60294dd/pip-26.2.1-py3-none-any.whl#sha256=71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e' 2>&1 | tee "$RUNNER_TEMP/pwa-measurement-setup/pip.log"
          "$RUNNER_TEMP/pwa-measurement-env/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --index-url https://pypi.org/simple 'https://download.pytorch.org/whl/cpu/torch-2.11.0%2Bcpu-cp310-cp310-manylinux_2_28_x86_64.whl#sha256=f378df648bf7fb94bbc820dfec37d3d346bd1703c692a2215edebf6edcef8b75' 2>&1 | tee "$RUNNER_TEMP/pwa-measurement-setup/torch.log"
          "$RUNNER_TEMP/pwa-measurement-env/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: 'https://files.pythonhosted.org/packages/b4/63/3de6a34ad7ad6646ac7d2f55ebc6ad439dbbf9c4370017c50cf403fb19b5/numpy-2.2.6-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=fc7b73d02efb0e18c000e9ad8b83480dfcd5dfd11065997ed4c6747470ae8915' 'https://files.pythonhosted.org/packages/ab/a8/2c41db714e0d83f51e3cec654da6b7d53718de2180c8041aaa7eb82d2431/coco_experiment-2.8.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.manylinux_2_28_x86_64.whl#sha256=39da2b14a7bd23890152fdc2a89253e89b0c832237ca0e4c1dba5293fdffa954' 2>&1 | tee "$RUNNER_TEMP/pwa-measurement-setup/numpy-coco.log"
      - name: Retrieve the pinned qualified source bundle and original inspection helper
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile
          assert os.environ['GITHUB_REPOSITORY'] == 'redeem123/PWA-component-evidence'
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          base = 'https://github.com/redeem123/PWA-component-evidence/releases/download/numerical-native532-v2/'
          with urllib.request.urlopen(base + 'PWA-numerical-source-v2.zip', timeout=60) as response:
              raw = response.read(16000001)
          assert len(raw) == 658954
          assert hashlib.sha256(raw).hexdigest() == '3c4e8bb25fe03de10c6b1507c5a3431f4a98eb8ef5d1e536635d91e061c3f872'
          with (root / 'qualified-source.zip').open('xb') as stream:
              stream.write(raw)
          target = root / 'pwa-v2-source'
          target.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(raw)) as stream:
              entries = stream.infolist()
              assert len(entries) == len({e.filename for e in entries}) <= 64
              assert sum(e.file_size for e in entries) <= 16000000
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts and str(path) == entry.filename
                  assert not entry.is_dir() and (entry.external_attr >> 16 & 0o170000) != 0o120000
                  output = target.joinpath(*path.parts)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  with output.open('xb') as out:
                      out.write(stream.read(entry))
          manifest = (target / 'numerical-source-bundle.json').read_bytes()
          assert hashlib.sha256(manifest).hexdigest() == 'f3a84e1db0d5faedcc89b59832b0d85ed6e72c58e4be03cdbf09626971531851'
          expected = json.loads(manifest)['filesSha256']
          actual = {str(p.relative_to(target)): hashlib.sha256(p.read_bytes()).hexdigest() for p in target.rglob('*') if p.is_file()}
          assert actual == {**expected, 'numerical-source-bundle.json': 'f3a84e1db0d5faedcc89b59832b0d85ed6e72c58e4be03cdbf09626971531851'}
          url = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + os.environ['GITHUB_SHA'] + '/verify_measurement_preflight.py'
          with urllib.request.urlopen(url, timeout=60) as response:
              helper = response.read(100001)
          assert len(helper) <= 100000 and hashlib.sha256(helper).hexdigest() == '3849db63e811b8d402f61ed718e70b2a1dd4ed9e5e070915eaa817868173cacc'
          with (root / 'inspect-public-measurement.py').open('xb') as output:
              output.write(helper)
          PY
      - name: Inspect the unchanged anonymous checkpoint and supplied state
        shell: bash
        run: |
          "$RUNNER_TEMP/pwa-measurement-env/bin/python" -I -B "$RUNNER_TEMP/inspect-public-measurement.py" --output "$RUNNER_TEMP/pwa-measurement-preflight"
      - name: Compute same-boot target request without native calls
        shell: bash
        run: |
          "$RUNNER_TEMP/pwa-measurement-env/bin/python" -I -B "$RUNNER_TEMP/pwa-v2-source/research/measurement_numerical_v2/host_job.py" --phase prepare --package "$RUNNER_TEMP/pwa-measurement-preflight/package" --job "mc4-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/pwa-v2-source/prepare.stdout.log" 2> "$RUNNER_TEMP/pwa-v2-source/prepare.stderr.log"
      - name: Export target request for actual author admission
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mc4-v2-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pwa-v2-source/host-handoff/request.json
          if-no-files-found: error
          retention-days: 30
      - name: Wait for independently authenticated author control then execute once
        shell: bash
        run: |
          "$RUNNER_TEMP/pwa-measurement-env/bin/python" -I -B "$RUNNER_TEMP/pwa-v2-source/research/measurement_numerical_v2/host_job.py" --phase wait --package "$RUNNER_TEMP/pwa-measurement-preflight/package" --job "mc4-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/pwa-v2-source/execution.stdout.log" 2> "$RUNNER_TEMP/pwa-v2-source/execution.stderr.log"
      - name: Preserve complete raw, admission and failure records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mc4-v2-measurement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pwa-measurement-setup
            ${{ runner.temp }}/pwa-v2-source/*.log
            ${{ runner.temp }}/pwa-v2-source/numerical-source-bundle.json
            ${{ runner.temp }}/pwa-v2-source/qualification
            ${{ runner.temp }}/pwa-v2-source/host-handoff
            ${{ runner.temp }}/pwa-v2-source/artifacts/qualifications/measurement_numerical_v2
          if-no-files-found: error
          retention-days: 90
