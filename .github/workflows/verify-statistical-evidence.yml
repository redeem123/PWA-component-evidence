name: Public statistical reader verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Create a fresh hash-pinned numerical environment
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/pwa-evidence-venv"
          "$RUNNER_TEMP/pwa-evidence-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --no-index --only-binary=:all: --no-deps 'https://files.pythonhosted.org/packages/8c/3d/1e1db36cfd41f895d266b103df00ca5b3cbe965184df824dec5c08c6b803/numpy-2.2.6-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=fd83c01228a688733f1ded5201c678f0c53ecc1006ffbc404db9f7a899ac6249'
      - name: Retrieve only the helper at this public workflow commit
        shell: bash
        run: |
          python3.12 - <<'PY'
          import hashlib, os, pathlib, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'redeem123/PWA-component-evidence'
          url = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + os.environ['GITHUB_SHA'] + '/verify_public_evidence.py'
          with urllib.request.urlopen(url, timeout=60) as response:
              code = response.read(100001)
          assert len(code) <= 100000
          assert hashlib.sha256(code).hexdigest() == 'f6cbd7270fe709869189521060ff5e8534c3cd53c2d50881b329e594e95f80ba'
          with (pathlib.Path(os.environ['RUNNER_TEMP']) / 'pwa-public-verifier.py').open('xb') as output:
              output.write(code)
          PY
      - name: Reconstruct all three public packages without authentication
        shell: bash
        run: |
          "$RUNNER_TEMP/pwa-evidence-venv/bin/python" -I "$RUNNER_TEMP/pwa-public-verifier.py" --output "$RUNNER_TEMP/pwa-public-reader-verification"
